name: Update Anime Rankings

on:
  schedule:
    # 每 6 小时更新一次（UTC）。B站播放量、bgm 当季榜单都是定时快照。
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch rankings
        # 抓取失败（上游 API 404/风控）时保留仓库已有 data.json，不阻断部署
        continue-on-error: true
        run: python3 scripts/fetch.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # 静态站根：index.html / style.css / app.js / data / assets / docs
          exclude: |
            .git
            .github
            scripts
            data/cache
            data/history

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
